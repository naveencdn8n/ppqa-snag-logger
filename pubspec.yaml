name: ppqa_snag_logger
description: Pre-Possession Quality Audit Snag Logger
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  intl: ^0.20.2
  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  # Google Sign-In
  google_sign_in: ^6.2.2
  # Google Sheets export
  gsheets: ^0.5.0
  # Offline support
  connectivity_plus: ^6.0.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/credentials/
