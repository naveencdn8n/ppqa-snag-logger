name: ppqa_snag_logger
description: Pre-Possession Quality Audit Snag Logger
publish_to: 'none'
version: 1.0.8+9

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  intl: ^0.20.2
  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  firebase_crashlytics: ^4.3.3
  # Google Sign-In
  google_sign_in: ^6.2.2
  # Google Sheets export (via Cloud Function — credentials stay server-side)
  cloud_functions: ^5.3.0
  # Offline support
  connectivity_plus: ^6.0.0
  path_provider: ^2.1.5
  # Photo markup
  image_painter: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#6C3FC8"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
